[package]
name = "diple"
version = "2.0.0"
edition = "2021"
rust-version = "1.81"
authors = ["Marcel Arentz <gdspd_you@open-one.de>"]
# Doubles as the Debian synopsis, which must stay on one short line.
description = "Interactive terminal reader for structured documents"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/godspeed-you/diple"
repository = "https://github.com/godspeed-you/diple"
documentation = "https://docs.rs/diple"
categories = ["command-line-utilities", "text-processing"]
# crates.io allows five; `tui` and `mermaid` gave way to the two formats
# that 2.0 made first-class, since those are what someone searches for.
keywords = ["markdown", "json", "yaml", "pager", "terminal"]
# Keep the published crate small: the benches, the fuzz crate and the CI
# plumbing are not needed to build or use diple. `tests/` stays in, snapshots
# included, so `cargo package` ships a crate whose test suite actually runs.
exclude = [
    "/.github",
    "/fuzz",
    "/packaging",
    "/scripts",
]

[lib]
name = "diple"
path = "src/lib.rs"

[[bin]]
name = "diple"
path = "src/main.rs"

[features]
# Syntect regex engine.
#
# `syntax-onig` (C Oniguruma) is the default because the startup budget (p50 <
# 30 ms to first frame) cannot be met without it. What dominates the first
# frame is compiling a syntax definition's patterns on first use, and diple
# cannot defer that when the code block is on the first screen — which is where
# a README puts it. Measured in a 100x24 pty over 25 runs each:
#
#     fancy-regex   p50 72.7 ms   p95 76.3 ms   (both budgets missed)
#     oniguruma     p50 22.3 ms   p95 27.2 ms   (both budgets met)
#
# `onig_sys` compiles C, so building from source needs a C compiler for the
# target. For `*-linux-musl` that must be a real musl compiler: with the
# host's glibc `cc`, Ubuntu's default `_FORTIFY_SOURCE` emits `__memcpy_chk`
# and `__snprintf_chk`, which do not exist in musl and fail at link time.
# Install `musl-tools` and point cargo at it:
#
#     CC_x86_64_unknown_linux_musl=musl-gcc \
#     CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
#     cargo build --release --target x86_64-unknown-linux-musl
#
# This is verified: the resulting binary is statically linked and its output
# is byte-identical to the glibc build. CI and scripts/release.sh do it.
#
# `syntax-fancy` (pure Rust, `fancy-regex`) needs no C toolchain and is the
# supported fallback for environments that cannot provide one. It is slower
# to start but otherwise equivalent:
#
#     cargo install diple --no-default-features --features syntax-fancy
default = ["syntax-onig"]
syntax-onig = ["syntect/default-onig"]
syntax-fancy = ["syntect/default-fancy"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
crossterm = "0.29"
# Only the parsing engine, the bundled syntaxes and the bundled themes are
# used; `html`, `plist-load`, `yaml-load` and `metadata` are not.
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
] }
# YAML 1.2, as an event stream with comments, scalar styles, tags and byte
# spans — everything a *reader* needs and a deserializer discards. Pure Rust,
# `unsafe` forbidden, MIT OR Apache-2.0, and two small transitive crates
# (`arraydeque`, `smallvec`). `serde_yaml` is unmaintained and binds data
# rather than exposing the source, so it is not an option here.
#
# It declares MSRV 1.81, which is why diple's `rust-version` is 1.81.
granit-parser = { version = "1.3", default-features = false, features = [
    "error_messages",
    "std",
] }
unicode-width = "0.2"
unicode-segmentation = "1.12"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "6.0"
anyhow = "1.0"
thiserror = "2.0"
open = "5.4"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"

# Only for the signal handler in `terminal::lifecycle` that restores the
# terminal on SIGTERM/SIGHUP: write(2), tcsetattr(3), signal(2), raise(3).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
insta = "1.48"
pretty_assertions = "1.4"
tempfile = "3.27"
assert_cmd = "2.2"
criterion = "0.8"

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "large"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
# `panic` is deliberately left at the default (`unwind`).
#
# `panic = "abort"` would shave a little size, but it breaks `cargo test
# --release` and `cargo bench`, which CI runs: the test harness needs
# unwinding, and cargo then has to build the library twice with conflicting
# panic strategies. The terminal-restoring panic hook runs under both
# strategies, so aborting buys no extra safety.

[profile.dev.package.insta]
opt-level = 3

# --- Debian packaging -------------------------------------------------------
#
# NOTE: the man page and the shell completions are produced by the binary
# itself (`diple --generate-man`, `diple --generate-completions <shell>`)
# and must exist in `target/assets/` BEFORE `cargo deb --no-build` is run.
# `scripts/release.sh` generates them into that directory; building the .deb
# without that step fails with a missing-asset error, on purpose.
[package.metadata.deb]
maintainer = "Marcel Arentz <gdspd_you@open-one.de>"
copyright = "2026, Marcel Arentz <gdspd_you@open-one.de>"
license-file = ["LICENSE", "0"]
section = "text"
priority = "optional"
depends = "$auto"
extended-description = """
diple reads Markdown, JSON and YAML in the terminal the way a pager reads
text, except that it keeps the document's structure instead of flattening it.
It does not merely syntax highlight these formats: it parses them, so folding,
navigation, search and the outline operate on semantic nodes. Headings and
objects, sections and mappings fold; tables are laid out to the terminal
width; code blocks are syntax highlighted; links are followable; YAML keeps
its comments, anchors and tags; and Mermaid diagrams are drawn with a built-in
renderer (or through mermaid-cli when it is available).
"""
assets = [
    ["target/release/diple", "usr/bin/", "755"],
    ["target/assets/diple.1", "usr/share/man/man1/diple.1", "644"],
    ["target/assets/diple.bash", "usr/share/bash-completion/completions/diple", "644"],
    ["target/assets/_diple", "usr/share/zsh/site-functions/_diple", "644"],
    ["target/assets/diple.fish", "usr/share/fish/vendor_completions.d/diple.fish", "644"],
    ["README.md", "usr/share/doc/diple/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/diple/CHANGELOG.md", "644"],
    ["LICENSE", "usr/share/doc/diple/LICENSE", "644"],
    ["docs/configuration.md", "usr/share/doc/diple/configuration.md", "644"],
    ["docs/keybindings.md", "usr/share/doc/diple/keybindings.md", "644"],
    ["docs/mermaid.md", "usr/share/doc/diple/mermaid.md", "644"],
    ["docs/terminal-compatibility-checklist.md", "usr/share/doc/diple/terminal-compatibility-checklist.md", "644"],
]

[package.metadata.deb.variants.musl]
depends = ""

# --- RPM packaging ----------------------------------------------------------
#
# Same prerequisite as the .deb: generate `target/assets/*` first, then run
# `cargo generate-rpm`.
[package.metadata.generate-rpm]
summary = "Interactive terminal reader for structured documents"
license = "MIT"
assets = [
    { source = "target/release/diple", dest = "/usr/bin/diple", mode = "755" },
    { source = "target/assets/diple.1", dest = "/usr/share/man/man1/diple.1", mode = "644", doc = true },
    { source = "target/assets/diple.bash", dest = "/usr/share/bash-completion/completions/diple", mode = "644" },
    { source = "target/assets/_diple", dest = "/usr/share/zsh/site-functions/_diple", mode = "644" },
    { source = "target/assets/diple.fish", dest = "/usr/share/fish/vendor_completions.d/diple.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/diple/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/diple/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/diple/LICENSE", mode = "644", doc = true },
    { source = "docs/configuration.md", dest = "/usr/share/doc/diple/configuration.md", mode = "644", doc = true },
    { source = "docs/keybindings.md", dest = "/usr/share/doc/diple/keybindings.md", mode = "644", doc = true },
    { source = "docs/mermaid.md", dest = "/usr/share/doc/diple/mermaid.md", mode = "644", doc = true },
    { source = "docs/terminal-compatibility-checklist.md", dest = "/usr/share/doc/diple/terminal-compatibility-checklist.md", mode = "644", doc = true },
]

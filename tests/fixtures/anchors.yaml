defaults: &defaults
  adapter: postgres
  host: localhost
  port: 5432
  pool: 5

logging: &logging
  level: info
  format: json

development:
  <<: *defaults
  database: app_development

test:
  <<: *defaults
  database: app_test
  pool: 1

production:
  <<: [*defaults, *logging]
  database: app_production
  host: db.internal
  replicas:
    - *defaults
    - *logging

aliased_scalar: &name "shared value"
reuse: *name
